packages:
  - block
  - kind
  - model
  - software/gpu-info
  - ui
  - workflow

catalog:
  # SDK packages - EXACT VERSIONS (no ^ or ~)
  '@milaboratories/ts-builder': 1.6.1
  '@milaboratories/ts-configs': 1.3.1
  '@platforma-sdk/workflow-tengo': 6.20.0
  '@platforma-sdk/model': 1.80.10
  '@platforma-sdk/ui-vue': 1.80.10
  '@platforma-sdk/tengo-builder': 4.1.17
  '@platforma-sdk/package-builder': 3.14.2
  '@platforma-sdk/block-tools': 2.17.5
  '@platforma-sdk/test': 1.80.11
  '@milaboratories/helpers': 1.14.2

  # Block-specific dependencies
  '@platforma-open/milaboratories.runenv-python-3': ^1.7.11

  # Common dependencies - can use ^ or ~
  'vue': 3.5.24
  'typescript': ~5.6.3
  'turbo': ~2.11.10
  'vitest': ^4.0.7
  'eslint': ^9.25.1
  '@changesets/cli': ^2.29.8
  'shx': ^0.4.0
minimumReleaseAgeExclude:
  - "@milaboratories/*"
  - "@platforma-sdk/*"
  - "@platforma-open/*"
allowBuilds:
  "@milaboratories/tengo-tester": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  "@milaboratories/pframes-rs-node": true
