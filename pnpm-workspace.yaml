packages:
  - block
  - kind
  - model
  - software/gpu-info
  - ui
  - workflow

catalog:
  # SDK packages - EXACT VERSIONS (no ^ or ~)
  '@milaboratories/ts-builder': 1.7.3
  '@milaboratories/ts-configs': 1.4.0
  '@platforma-sdk/workflow-tengo': 6.17.3
  '@platforma-sdk/model': 1.86.3
  '@platforma-sdk/ui-vue': 1.86.3
  '@platforma-sdk/tengo-builder': 4.1.14
  '@platforma-sdk/package-builder': 3.16.2
  '@platforma-sdk/block-tools': 2.17.0
  '@platforma-sdk/test': 1.86.4
  '@milaboratories/helpers': 1.14.6

  # Block-specific dependencies
  '@platforma-open/milaboratories.runenv-python-3': ^1.7.11

  # Common dependencies - can use ^ or ~
  'vue': 3.5.44
  'typescript': ~5.6.3
  'turbo': ~2.11.10
  'vitest': ^4.0.7
  'eslint': ^9.25.1
  '@changesets/cli': ^2.29.8
  'shx': ^0.4.0
  "@platforma-sdk/block-kind": 1.1.0
minimumReleaseAgeExclude:
  - "@milaboratories/*"
  - "@platforma-sdk/*"
  - "@platforma-open/*"
allowBuilds:
  "@milaboratories/tengo-tester": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  "@milaboratories/pframes-rs-node": true
